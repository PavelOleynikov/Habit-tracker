[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]


[tool.poetry.dependencies]
python = ">=3.13,<4.0"
django = ">=5.2.3,<6.0.0"
requests = ">=2.32.5,<3.0.0"
ipython = ">=9.9.0,<10.0.0"
psycopg2 = ">=2.9.11,<3.0.0"
pillow = ">=12.1.0,<13.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
djangorestframework = ">=3.16.1,<4.0.0"
django-filter = ">=25.2,<26.0"
djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
coverage = ">=7.13.4,<8.0.0"
drf-yasg = ">=1.21.14,<2.0.0"
django-cors-headers = ">=4.9.0,<5.0.0"
celery = ">=5.6.2,<6.0.0"
redis = ">=7.2.0,<8.0.0"
eventlet = ">=0.40.4,<0.41.0"
django-timezone-field = ">=7.2"
django-celery-beat = ">=2.8.1,<4.0.0"
django-redis = "^6.0.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^26.1.0"
flake8-pyproject = "^1.2.4"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.flake8]
max-line-length = 140
extend-ignore = ["E203", "W503"]
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "migrations",
    ".tox",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    "docs"
]

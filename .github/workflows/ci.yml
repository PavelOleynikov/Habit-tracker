# Пайплайн - включает линтинг, тестирование, сборку Docker-образа и деплой на сервер
name: Django CI/CD Pipeline

# Триггеры запуска: при push в любой ветку и при создании pull request
on: [ push, pull_request ]

jobs:
  lint: # Проверка качества кода
    runs-on: ubuntu-latest

    steps:
      - name: Check out code # Загружает исходный код репозитория в виртуальную машину GitHub Actions
        uses: actions/checkout@v4

      - name: Set up Python # Устанавливает указанную версию Python в окружение сборщика
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install dependencies # Устанавливает Poetry и все зависимости проекта
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Flake8 # Запускает линтер Flake8 для проверки стиля кода
        run: poetry run flake8 .

  test: # Запуск тестов Django
    needs: lint # Зависимость: запускается только после успешного выполнения lint
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "0"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Cache Poetry dependencies # Кэширует зависимости Poetry для ускорения последующих запусков
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies # Устанавливает зависимости, используя кэш если доступен
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run migrations # Применяет миграции Django к тестовой базе данных
        run: poetry run python manage.py migrate

      - name: Run tests # Запускает все тесты Django
        run: poetry run python manage.py test

  build: # Сборка и публикация Docker-образа
    needs: test # Зависимость: запускается только после успешного прохождения тестов
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub # Аутентификация в Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image # Собирает Docker-образ из Dockerfile
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub # Загружает собранный образ в Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy: # Развертывание на сервере
    needs: build # Зависимость: запускается только после успешной публикации образа
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH # Настраивает SSH-агент с приватным ключом для доступа к серверу
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server # Выполняет команды на удалённом сервере через SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << "EOF"
            cd ~/Habit-tracker

            # Обновляем .env файл
            cat > .env << 'ENV_EOF'
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=0
            NAME=${DB_NAME:-mydb}
            DB_USER=${DB_USER:-postgres}
            PASSWORD=${DB_PASSWORD:-password}
            HOST=db
            PORT=5432
            ENV_EOF

            # Останавливаем старые контейнеры
            docker compose down

            # Обновляем образы
            docker compose pull web celery celery_beat

            # Запускаем все сервисы
            docker compose up -d

            # Очищаем неиспользуемые образы
            docker image prune -f
          EOF
